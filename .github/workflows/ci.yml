name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install the package and test dependencies
        run: pip install -e ".[dev]"

      - name: Byte-compile every module
        run: python -m compileall -q src scripts bench

      - name: Run the test suite
        run: python -m pytest tests/ -q

      - name: CLI smoke test
        run: |
          qwen25vl-lite tiers
          qwen25vl-lite probe --device cpu --head-dim 128
          qwen25vl-lite plan --vram-gb 8 --ram-gb 96 --weight-dtype int4
